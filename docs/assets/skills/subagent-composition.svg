      <text x="77" y="33" text-anchor="middle" fill="#cafff2" font-size="14" font-weight="800">PARENT TASK</text>
      <path d="M40 58h74M40 77h54" stroke="#427d77" stroke-width="8" stroke-linecap="round"/>
    </g>
    <path d="M201 228h59" stroke="#60ddc8" stroke-width="3"/><path d="m252 220 13 8-13 8" fill="#60ddc8"/>
    <g transform="translate(278 182)">
