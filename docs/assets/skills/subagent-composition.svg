      <path d="m19 38 9 9 17-20" fill="none" stroke="#b5ffdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="31" y="103" text-anchor="middle" fill="#7edac8" font-size="11" font-weight="800">GATE</text>
    </g>
