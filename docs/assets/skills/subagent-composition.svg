      <path d="M-55 75H0M0 75V19M0 75v57M0 75h111" fill="none" stroke="#4aaea3" stroke-width="2" stroke-dasharray="4 5"/>
      <g transform="translate(10 0)"><rect width="119" height="44" rx="13" fill="#102c31" stroke="#57d8ef"/><circle cx="20" cy="22" r="8" fill="#66e4f3"/><text x="70" y="27" text-anchor="middle" fill="#d8fbff">COLD</text></g>
      <g transform="translate(10 54)"><rect width="119" height="44" rx="13" fill="#102f2a" stroke="#71e5a2"/><circle cx="20" cy="22" r="8" fill="#72e6a3"/><text x="70" y="27" text-anchor="middle" fill="#e0ffea">FORK</text></g>
      <g transform="translate(10 108)"><rect width="119" height="44" rx="13" fill="#163029" stroke="#b4dd6b"/><circle cx="20" cy="22" r="8" fill="#c7e675"/><text x="72" y="27" text-anchor="middle" fill="#f5ffd9">PARALLEL</text></g>
      <g transform="translate(141 54)"><rect width="119" height="44" rx="13" fill="#1c2b38" stroke="#7399dd"/><circle cx="20" cy="22" r="8" fill="#7da4e9"/><text x="70" y="27" text-anchor="middle" fill="#e6efff">BACKGROUND</text></g>
