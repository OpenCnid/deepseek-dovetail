<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Subagent Composition</title>
  <desc id="desc">A guarded router sends work to cold, forked, foreground, or background agents and brings framed results home.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07171a"/><stop offset="1" stop-color="#113a37"/></linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55e1ed"/><stop offset="1" stop-color="#71ef9f"/></linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#8cf4dc" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="720" height="400" rx="24" fill="url(#bg)"/><rect width="720" height="400" rx="24" fill="url(#grid)"/>
  <g font-family="Inter,Segoe UI,sans-serif">
