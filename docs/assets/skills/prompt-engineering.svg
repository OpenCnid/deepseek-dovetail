<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Engineering</title>
  <desc id="desc">Loose thoughts pass through a structural prism and become a precise, layered prompt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#122d3d"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#39d6ff"/><stop offset="1" stop-color="#6ff0bd"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9dd8e8" stroke-opacity=".07"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="400" rx="24" fill="url(#bg)"/><rect width="720" height="400" rx="24" fill="url(#grid)"/>
  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="38" y="48" fill="#6eeac0" font-size="12" font-weight="800" letter-spacing="2">DOVETAIL SKILL</text>
    <text x="38" y="94" fill="#f2fbff" font-size="34" font-weight="800">Prompt Engineering</text>
    <text x="38" y="126" fill="#a9c8d5" font-size="15">Turn fuzzy intent into precise instruction architecture.</text>
    <g transform="translate(42 174)" fill="none" stroke="#4d8294" stroke-width="2" stroke-linecap="round">
      <path d="M0 10c38-28 66 31 104 3s69 20 100-6"/><path d="M0 48c30 19 60-24 95 4s73-22 112 2"/><path d="M0 86c39-33 64 31 101 1s68 24 105-8"/>
    </g>
    <g transform="translate(285 166)" filter="url(#glow)"><path d="M0 0l86 42-86 122-36-82z" fill="#0d3040" stroke="url(#ink)" stroke-width="2"/><path d="M-17 73h65M3 39l42 49" fill="none" stroke="#73e7d6" stroke-opacity=".65"/></g>
    <g transform="translate(407 155)">
      <rect width="267" height="166" rx="18" fill="#0b1b29" stroke="#3a8da2"/>
      <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">
        <text x="21" y="35" fill="#59dfff">&lt;context&gt;</text><rect x="116" y="23" width="120" height="14" rx="7" fill="#244252"/>
        <text x="21" y="69" fill="#72efbf">&lt;task&gt;</text><rect x="91" y="57" width="151" height="14" rx="7" fill="#275040"/>
        <text x="21" y="103" fill="#b895ff">&lt;constraints&gt;</text><rect x="141" y="91" width="102" height="14" rx="7" fill="#41325d"/>
        <text x="21" y="137" fill="#f3c776">&lt;output&gt;</text><rect x="104" y="125" width="139" height="14" rx="7" fill="#53452b"/>
      </g>
    </g>
    <g transform="translate(38 348)" font-size="12" font-weight="700"><rect width="128" height="28" rx="14" fill="#123447" stroke="#3988a0"/><text x="64" y="18" text-anchor="middle" fill="#d5f7ff">STRUCTURE</text><rect x="140" width="124" height="28" rx="14" fill="#153a32" stroke="#3d9b79"/><text x="202" y="18" text-anchor="middle" fill="#dcfff0">GROUND</text><rect x="276" width="136" height="28" rx="14" fill="#2c2440" stroke="#7656a8"/><text x="344" y="18" text-anchor="middle" fill="#f0e6ff">ATTENTION</text></g>
  </g>
  <rect x="1" y="1" width="718" height="398" rx="23" fill="none" stroke="#69dceb" stroke-opacity=".2" stroke-width="2"/>
</svg>
