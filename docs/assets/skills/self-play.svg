<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Self-Play</title>
  <desc id="desc">A controlled arena cycles through gatherer, adversary, evaluator, and judge roles around a preregistered design.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08141f"/><stop offset="1" stop-color="#263548"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#53dcff"/><stop offset=".5" stop-color="#ff8faf"/><stop offset="1" stop-color="#ffd06b"/></linearGradient>
    <pattern id="board" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#80a8bd" fill-opacity=".045"/><rect x="20" y="20" width="20" height="20" fill="#80a8bd" fill-opacity=".045"/></pattern>
  </defs>
  <rect width="720" height="400" rx="24" fill="url(#bg)"/><rect width="720" height="400" rx="24" fill="url(#board)"/>
  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="38" y="48" fill="#75dfff" font-size="12" font-weight="800" letter-spacing="2">DOVETAIL SKILL</text>
    <text x="38" y="94" fill="#f4fbff" font-size="34" font-weight="800">Self-Play</text>
    <text x="38" y="126" fill="#b4cad8" font-size="15">Make a design survive neutral ground and hostile testing.</text>
    <g transform="translate(43 174)">
      <rect width="204" height="142" rx="18" fill="#0d1e2a" stroke="#52798d"/>
      <text x="21" y="29" fill="#ffd576" font-size="12" font-weight="800">PRE-REGISTER</text>
      <g font-size="11" fill="#9db6c4"><text x="21" y="55">prediction</text><text x="21" y="78">falsifying cell</text><text x="21" y="101">condemning cell</text><text x="21" y="124">stopping rule</text></g>
      <g fill="#365364"><circle cx="174" cy="51" r="5"/><circle cx="174" cy="74" r="5"/><circle cx="174" cy="97" r="5"/><circle cx="174" cy="120" r="5"/></g>
    </g>
    <path d="M252 245h43" stroke="#63bfd6" stroke-width="3"/><path d="m288 237 13 8-13 8" fill="#63bfd6"/>
    <g transform="translate(330 143)">
      <circle cx="137" cy="96" r="91" fill="#101d29" stroke="url(#ring)" stroke-width="3"/>
      <circle cx="137" cy="96" r="43" fill="#192b38" stroke="#6d8fa0"/>
      <text x="137" y="91" text-anchor="middle" fill="#f0f8fb" font-size="13" font-weight="900">CANDIDATE</text><text x="137" y="109" text-anchor="middle" fill="#88a9b8" font-size="10">not a conclusion</text>
      <g text-anchor="middle" font-size="10" font-weight="800">
        <g transform="translate(137 4)"><circle r="27" fill="#142b39" stroke="#5ed9ff"/><text y="4" fill="#d9f8ff">GATHER</text></g>
        <g transform="translate(229 96)"><circle r="27" fill="#36202d" stroke="#f080a7"/><text y="4" fill="#ffe0ea">ATTACK</text></g>
        <g transform="translate(137 188)"><circle r="27" fill="#2c2c1d" stroke="#e7c05d"/><text y="4" fill="#fff0ba">EVAL</text></g>
        <g transform="translate(45 96)"><circle r="27" fill="#28213b" stroke="#a98bea"/><text y="4" fill="#eee4ff">JUDGE</text></g>
      </g>
      <path d="M166 16c35 11 57 34 66 63M217 125c-14 34-39 52-64 58M108 180c-34-11-57-34-65-63M55 67c14-34 39-52 64-58" fill="none" stroke="#8eafbc" stroke-width="2" stroke-dasharray="4 6"/>
    </g>
    <g transform="translate(582 174)" font-size="10" font-weight="800"><rect width="97" height="129" rx="16" fill="#0d1d29" stroke="#4f7387"/><text x="48" y="26" text-anchor="middle" fill="#b7ced9">VISIBILITY</text><path d="M18 42h61M18 67h61M18 92h61" stroke="#375262"/><circle cx="28" cy="54" r="5" fill="#63d7ef"/><circle cx="49" cy="79" r="5" fill="#f08da9"/><circle cx="70" cy="104" r="5" fill="#e8c463"/></g>
    <text x="39" y="371" fill="#8eabb9" font-size="12" font-weight="700" letter-spacing="1">COLD ROLES · INPUT LEDGER · STOPPING RULE · DISCLOSED LIMITS</text>
  </g>
  <rect x="1" y="1" width="718" height="398" rx="23" fill="none" stroke="#65cbe4" stroke-opacity=".22" stroke-width="2"/>
</svg>
